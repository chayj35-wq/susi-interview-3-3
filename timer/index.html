<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>면접 타이머 · 수시 면접전형 준비</title>
<link rel="stylesheet" href="../assets/style.css">
<script>document.documentElement.classList.add('gate-lock')</script>
<style>html.gate-lock body{visibility:hidden}</style>
<style>
  .tm-wrap { max-width: 520px; margin: 0 auto; padding: 40px 24px 80px; text-align: center; }
  .tm-ring-box { position: relative; width: min(280px, 70vw); height: min(280px, 70vw); margin: 20px auto 6px; }
  .tm-ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .tm-ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
  .tm-ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.25s ease;
  }
  .tm-ring-fg.tm-danger { stroke: #ff3b30; }
  .tm-time {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(36px, 9vw, 54px);
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .tm-presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 22px 0 10px; }
  .tm-preset {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 980px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tm-preset:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .tm-preset.tm-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tm-custom { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 26px; font-size: 14px; color: var(--text-secondary); }
  .tm-custom input {
    width: 64px;
    text-align: center;
    padding: 9px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .tm-controls { display: flex; gap: 12px; justify-content: center; }
  .tm-status { margin-top: 18px; font-size: 14.5px; color: var(--text-secondary); min-height: 20px; }
  .tm-status.tm-done { color: #ff3b30; font-weight: 700; }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <span class="brand">면접 타이머</span>
    <a class="back" href="../index.html">← 전체 목록</a>
  </div>
</nav>

<header class="hero" style="padding:48px 0 8px;">
  <div class="wrap">
    <div class="eyebrow">수시 면접전형 준비</div>
    <h1 style="font-size:clamp(24px,4vw,36px);">면접 타이머</h1>
    <p>시간을 정해두고 실전처럼 답변을 연습해보세요. 시간이 끝나면 소리와 함께 알려드려요.</p>
  </div>
</header>

<main class="tm-wrap">
  <div class="tm-ring-box">
    <svg viewBox="0 0 120 120">
      <circle class="tm-ring-bg" cx="60" cy="60" r="52"></circle>
      <circle class="tm-ring-fg" id="tm-ring" cx="60" cy="60" r="52"></circle>
    </svg>
    <div class="tm-time" id="tm-time">01:00</div>
  </div>

  <div class="tm-presets">
    <button class="tm-preset" data-sec="60">1분</button>
    <button class="tm-preset" data-sec="120">2분</button>
    <button class="tm-preset" data-sec="180">3분</button>
    <button class="tm-preset" data-sec="300">5분</button>
    <button class="tm-preset" data-sec="600">10분</button>
  </div>

  <div class="tm-custom">
    직접 입력:
    <input type="number" id="tm-min" min="0" max="59" value="0" aria-label="분">분
    <input type="number" id="tm-sec" min="0" max="59" value="0" aria-label="초">초
    <button class="btn btn-ghost btn-sm" id="tm-apply">적용</button>
  </div>

  <div class="tm-controls">
    <button class="btn btn-primary" id="tm-start">시작</button>
    <button class="btn btn-ghost" id="tm-pause" disabled>일시정지</button>
    <button class="btn btn-ghost" id="tm-reset">초기화</button>
  </div>

  <div class="tm-status" id="tm-status">1분으로 설정되어 있어요. 시작을 눌러주세요.</div>
</main>

<footer>
  <div class="wrap">관리자: 차윤정 (3학년 3반 담임)</div>
</footer>

<script src="../assets/config.js"></script>
<script src="../assets/gate.js"></script>
<script>
  const timeEl = document.getElementById("tm-time");
  const ring = document.getElementById("tm-ring");
  const statusEl = document.getElementById("tm-status");
  const startBtn = document.getElementById("tm-start");
  const pauseBtn = document.getElementById("tm-pause");
  const resetBtn = document.getElementById("tm-reset");
  const applyBtn = document.getElementById("tm-apply");
  const minInput = document.getElementById("tm-min");
  const secInput = document.getElementById("tm-sec");
  const presetBtns = [...document.querySelectorAll(".tm-preset")];

  const CIRC = 2 * Math.PI * 52;
  ring.style.strokeDasharray = `${CIRC}`;
  ring.style.strokeDashoffset = "0";

  let totalSec = 60;
  let remainSec = 60;
  let timerId = null;
  let running = false;

  function fmt(s) {
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return `${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  }

  function updateDisplay() {
    timeEl.textContent = fmt(remainSec);
    const frac = totalSec > 0 ? remainSec / totalSec : 0;
    ring.style.strokeDashoffset = `${CIRC * (1 - frac)}`;
    ring.classList.toggle("tm-danger", remainSec <= 10 && remainSec > 0);
  }

  function setTotal(sec, label) {
    if (running) return;
    totalSec = sec;
    remainSec = sec;
    minInput.value = Math.floor(sec / 60);
    secInput.value = sec % 60;
    statusEl.classList.remove("tm-done");
    statusEl.textContent = label ? `${label}으로 설정되어 있어요. 시작을 눌러주세요.` : "설정되어 있어요. 시작을 눌러주세요.";
    presetBtns.forEach((b) => b.classList.toggle("tm-active", Number(b.dataset.sec) === sec));
    updateDisplay();
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.28, 0.56].forEach((delay) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.22);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.25);
      });
    } catch (e) {}
  }

  function tick() {
    remainSec -= 1;
    if (remainSec <= 0) {
      remainSec = 0;
      updateDisplay();
      stop();
      statusEl.textContent = "⏰ 시간이 끝났어요!";
      statusEl.classList.add("tm-done");
      beep();
      return;
    }
    updateDisplay();
  }

  function start() {
    if (running) return;
    if (remainSec <= 0) remainSec = totalSec;
    running = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    statusEl.classList.remove("tm-done");
    statusEl.textContent = "진행 중이에요…";
    timerId = setInterval(tick, 1000);
  }

  function stop() {
    running = false;
    clearInterval(timerId);
    startBtn.disabled = false;
    pauseBtn.disabled = true;
  }

  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", () => {
    stop();
    statusEl.textContent = "일시정지했어요.";
  });
  resetBtn.addEventListener("click", () => {
    stop();
    remainSec = totalSec;
    statusEl.classList.remove("tm-done");
    statusEl.textContent = "초기화했어요. 시작을 눌러주세요.";
    updateDisplay();
  });

  presetBtns.forEach((btn) => {
    btn.addEventListener("click", () => setTotal(Number(btn.dataset.sec), btn.textContent));
  });

  applyBtn.addEventListener("click", () => {
    const m = Math.max(0, Math.min(59, parseInt(minInput.value, 10) || 0));
    const s = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
    const sec = m * 60 + s;
    if (sec <= 0) {
      statusEl.textContent = "1초 이상으로 설정해주세요.";
      return;
    }
    setTotal(sec, null);
  });

  setTotal(60, "1분");
</script>
</body>
</html>
