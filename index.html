<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>홍익디자인고 3-3 수시 면접전형 준비</title>
<link rel="stylesheet" href="assets/style.css">
<script>document.documentElement.classList.add('gate-lock')</script>
<style>html.gate-lock body{visibility:hidden}</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <span class="brand">홍익디자인고 3-3 · 수시 면접전형 준비</span>
    <a class="back" href="#student-grid">학생 목록 ↓</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">화성홍익디자인고등학교 · 3학년 3반</div>
    <h1>수시 면접전형 준비</h1>
    <p>대학·학과 리서치부터 자기소개, 예상 질문까지 —<br>내 이름을 찾아 들어가서 하나씩 채워보세요.</p>
    <a class="btn btn-ghost" href="files/interview_prep_worksheet.xlsx" download style="display:inline-flex;margin-top:20px;">
      📄 대학면접준비 학생워크시트 다운로드 (xlsx)
    </a>
  </div>
</header>

<main class="section" id="student-grid">
  <div class="wrap">
    <h2 class="section-title">학생 목록</h2>
    <p class="section-sub">본인 번호·이름을 찾아 클릭하면 개인 작성 페이지로 이동합니다.</p>
    <div class="grid">
      <!-- STUDENT_CARDS -->
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    관리자: 차윤정 (3학년 3반 담임) · 이 페이지의 조사 내용은 면접 준비 참고용이며,
    실제 지원자격·전형방법은 반드시 각 대학의 최신 모집요강으로 재확인해야 합니다.
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/gate.js"></script>
<script>
  const grid = document.querySelector(".grid");
  SITE_CONFIG.students.forEach((s) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `students/${s.no}/`;
    a.innerHTML = `<div class="no">${parseInt(s.no, 10)}번</div><div class="name">${s.name}</div>
      <div class="status"><span class="dot"></span>작성하러 가기</div>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
