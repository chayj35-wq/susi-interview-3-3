<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>면접 예상질문 카드 · 수시 면접전형 준비</title>
<link rel="stylesheet" href="../assets/style.css">
<script>document.documentElement.classList.add('gate-lock')</script>
<style>html.gate-lock body{visibility:hidden}</style>
<style>
  .qc-wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px 80px; text-align: center; }
  .qc-cat {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }
  .qc-stage {
    position: relative;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .qc-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    padding: 48px 32px;
    font-size: clamp(20px, 3.4vw, 27px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.5;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .qc-card.qc-anim { opacity: 0; transform: scale(0.97); }
  .qc-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .qc-arrow {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .qc-arrow:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .qc-arrow:active { transform: scale(0.94); }
  .qc-arrow:disabled { opacity: 0.35; cursor: default; }
  .qc-arrow:disabled:hover { background: var(--surface); }
  .qc-counter { font-size: 14px; color: var(--text-secondary); font-weight: 600; min-width: 70px; }
  .qc-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  .qc-hint { color: var(--text-secondary); font-size: 13.5px; margin-top: 18px; }

  .qc-timer-box {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }
  .qc-timer-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .tm-ring-box { position: relative; width: min(160px, 45vw); height: min(160px, 45vw); margin: 0 auto 6px; }
  .tm-ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .tm-ring-bg { fill: none; stroke: var(--border); stroke-width: 9; }
  .tm-ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.25s ease;
  }
  .tm-ring-fg.tm-danger { stroke: #ff3b30; }
  .tm-time {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .tm-presets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 16px 0 12px; }
  .tm-preset {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 980px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tm-preset:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .tm-preset.tm-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tm-controls { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
  .tm-status { margin-top: 12px; font-size: 13.5px; color: var(--text-secondary); min-height: 18px; }
  .tm-status.tm-done { color: #ff3b30; font-weight: 700; }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <span class="brand">면접 예상질문 카드</span>
    <a class="back" href="../index.html">← 전체 목록</a>
  </div>
</nav>

<header class="hero" style="padding:48px 0 8px;">
  <div class="wrap">
    <div class="eyebrow">수시 면접전형 준비</div>
    <h1 style="font-size:clamp(24px,4vw,36px);">면접 예상질문 카드</h1>
    <p>질문만 카드로 하나씩 보여드려요. 화살표를 눌러 다음/이전 질문으로 넘어가며 실전처럼 답변을 연습해보세요.</p>
  </div>
</header>

<main class="qc-wrap">
  <div class="qc-cat" id="qc-cat">디자인계열</div>

  <div class="qc-stage">
    <div class="qc-card" id="qc-card"></div>
  </div>

  <div class="qc-nav">
    <button class="qc-arrow" id="qc-prev" aria-label="이전 질문">←</button>
    <span class="qc-counter" id="qc-counter">1 / 32</span>
    <button class="qc-arrow" id="qc-next" aria-label="다음 질문">→</button>
  </div>

  <div class="qc-tools">
    <button class="btn btn-ghost btn-sm" id="qc-shuffle">🔀 순서 섞기</button>
    <button class="btn btn-ghost btn-sm" id="qc-restart">↺ 처음부터</button>
  </div>

  <p class="qc-hint">키보드 ← → 방향키로도 넘길 수 있어요. 실제 면접 문항은 대학마다 다르니, 이 카드는 연습용 참고 질문입니다.</p>

  <div class="qc-timer-box">
    <div class="qc-timer-title">⏱️ 답변 타이머</div>
    <div class="tm-ring-box">
      <svg viewBox="0 0 120 120">
        <circle class="tm-ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="tm-ring-fg" id="tm-ring" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="tm-time" id="tm-time">01:00</div>
    </div>
    <div class="tm-presets">
      <button class="tm-preset" data-sec="30">30초</button>
      <button class="tm-preset" data-sec="60">1분</button>
      <button class="tm-preset" data-sec="120">2분</button>
      <button class="tm-preset" data-sec="180">3분</button>
    </div>
    <div class="tm-controls">
      <button class="btn btn-primary btn-sm" id="tm-start">시작</button>
      <button class="btn btn-ghost btn-sm" id="tm-pause" disabled>일시정지</button>
      <button class="btn btn-ghost btn-sm" id="tm-reset">초기화</button>
    </div>
    <div class="tm-status" id="tm-status">1분으로 설정되어 있어요.</div>
    <p class="qc-hint" style="margin-top:10px;">더 다양한 시간 설정은 <a href="../timer/" style="color:var(--accent);font-weight:600;">면접 타이머 페이지</a>에서 할 수 있어요.</p>
  </div>
</main>

<footer>
  <div class="wrap">관리자: 차윤정 (3학년 3반 담임)</div>
</footer>

<script src="../assets/config.js"></script>
<script src="../assets/gate.js"></script>
<script>
  const QUESTIONS = [
    { cat: "디자인계열", q: "본인이 생각하는 좋은 디자인이란 무엇인가요?" },
    { cat: "디자인계열", q: "최근 관심 있게 본 디자인·미술 작품이나 작가가 있나요?" },
    { cat: "디자인계열", q: "포트폴리오(작품) 중 가장 자신 있는 작품을 소개해보세요." },
    { cat: "디자인계열", q: "그 작품을 제작하면서 어려웠던 점과 해결 방법은 무엇이었나요?" },
    { cat: "디자인계열", q: "평소 어떤 디자인 트렌드나 이슈에 관심이 있나요?" },
    { cat: "디자인계열", q: "본인의 디자인 스타일을 한 단어로 표현한다면?" },
    { cat: "디자인계열", q: "디자인을 할 때 가장 중요하게 생각하는 요소는 무엇인가요?" },
    { cat: "디자인계열", q: "협업으로 진행한 디자인 프로젝트 경험이 있다면 소개해주세요." },
    { cat: "디자인계열", q: "실패했던 작품이나 프로젝트 경험이 있다면 이야기해보세요." },
    { cat: "디자인계열", q: "창의성을 기르기 위해 평소 어떤 노력을 하나요?" },
    { cat: "디자인계열", q: "AI가 디자인 분야에 미치는 영향에 대해 어떻게 생각하나요?" },
    { cat: "문화콘텐츠계열", q: "본인이 생각하는 좋은 콘텐츠란 무엇인가요?" },
    { cat: "문화콘텐츠계열", q: "최근 흥미롭게 본 영상·웹툰·게임·SNS 콘텐츠가 있다면 소개해보세요." },
    { cat: "문화콘텐츠계열", q: "직접 기획하거나 제작해본 콘텐츠(영상, 카드뉴스, SNS 게시물 등)가 있다면 소개해보세요." },
    { cat: "문화콘텐츠계열", q: "그 콘텐츠를 만들면서 가장 신경 썼던 부분은 무엇인가요?" },
    { cat: "문화콘텐츠계열", q: "평소 어떤 플랫폼이나 트렌드에 관심이 있나요? (유튜브, 틱톡, 인스타그램 등)" },
    { cat: "문화콘텐츠계열", q: "좋은 스토리텔링이란 무엇이라고 생각하나요?" },
    { cat: "문화콘텐츠계열", q: "콘텐츠를 기획할 때 시청자·독자를 어떻게 고려하나요?" },
    { cat: "문화콘텐츠계열", q: "팀으로 콘텐츠를 제작해본 경험이 있다면 자신의 역할을 소개해보세요." },
    { cat: "문화콘텐츠계열", q: "콘텐츠 제작 중 어려움을 겪었던 경험과 해결 방법을 말해보세요." },
    { cat: "문화콘텐츠계열", q: "AI가 콘텐츠 제작 분야에 미치는 영향에 대해 어떻게 생각하나요?" },
    { cat: "일반질문", q: "자기소개를 1분 이내로 해보세요." },
    { cat: "일반질문", q: "우리 대학(학과)에 지원한 동기는 무엇인가요?" },
    { cat: "일반질문", q: "고등학교 재학 중 가장 기억에 남는 활동은 무엇인가요?" },
    { cat: "일반질문", q: "특성화고를 선택한 이유는 무엇인가요?" },
    { cat: "일반질문", q: "특성화고 재학 중 배운 점 중 대학생활에 도움이 될 것 같은 점은 무엇인가요?" },
    { cat: "일반질문", q: "자신의 장점과 단점을 각각 말해보세요." },
    { cat: "일반질문", q: "학교생활 중 어려움을 극복했던 경험이 있나요?" },
    { cat: "일반질문", q: "팀 프로젝트나 조별활동에서 갈등을 해결한 경험이 있나요?" },
    { cat: "일반질문", q: "입학 후 구체적인 학업계획을 말해보세요." },
    { cat: "일반질문", q: "졸업 후 진로 계획은 무엇인가요?" },
    { cat: "일반질문", q: "마지막으로 하고 싶은 말이 있다면 자유롭게 말해보세요." },
  ];

  let order = QUESTIONS.map((_, i) => i);
  let pos = 0;

  const cardEl = document.getElementById("qc-card");
  const catEl = document.getElementById("qc-cat");
  const counterEl = document.getElementById("qc-counter");
  const prevBtn = document.getElementById("qc-prev");
  const nextBtn = document.getElementById("qc-next");

  function render(animate) {
    const item = QUESTIONS[order[pos]];
    const show = () => {
      catEl.textContent = item.cat;
      cardEl.textContent = item.q;
      counterEl.textContent = `${pos + 1} / ${order.length}`;
      prevBtn.disabled = pos === 0;
      nextBtn.disabled = pos === order.length - 1;
      cardEl.classList.remove("qc-anim");
    };
    if (animate) {
      cardEl.classList.add("qc-anim");
      setTimeout(show, 140);
    } else {
      show();
    }
  }

  function go(delta) {
    const next = pos + delta;
    if (next < 0 || next >= order.length) return;
    pos = next;
    render(true);
  }

  prevBtn.addEventListener("click", () => go(-1));
  nextBtn.addEventListener("click", () => go(1));

  document.getElementById("qc-shuffle").addEventListener("click", () => {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    render(true);
  });

  document.getElementById("qc-restart").addEventListener("click", () => {
    order = QUESTIONS.map((_, i) => i);
    pos = 0;
    render(true);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  render(false);

  /* ---------- 답변 타이머(카드 페이지 하단, 간단 버전) ---------- */
  (function () {
    const timeEl = document.getElementById("tm-time");
    const ring = document.getElementById("tm-ring");
    const statusEl = document.getElementById("tm-status");
    const startBtn = document.getElementById("tm-start");
    const pauseBtn = document.getElementById("tm-pause");
    const resetBtn = document.getElementById("tm-reset");
    const presetBtns = [...document.querySelectorAll(".tm-preset")];

    const CIRC = 2 * Math.PI * 52;
    ring.style.strokeDasharray = `${CIRC}`;
    ring.style.strokeDashoffset = "0";

    let totalSec = 60;
    let remainSec = 60;
    let timerId = null;
    let running = false;

    function fmt(s) {
      const m = Math.floor(s / 60);
      const ss = s % 60;
      return `${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
    }

    function updateDisplay() {
      timeEl.textContent = fmt(remainSec);
      const frac = totalSec > 0 ? remainSec / totalSec : 0;
      ring.style.strokeDashoffset = `${CIRC * (1 - frac)}`;
      ring.classList.toggle("tm-danger", remainSec <= 10 && remainSec > 0);
    }

    function setTotal(sec, label) {
      if (running) return;
      totalSec = sec;
      remainSec = sec;
      statusEl.classList.remove("tm-done");
      statusEl.textContent = label ? `${label}으로 설정되어 있어요.` : "설정되어 있어요.";
      presetBtns.forEach((b) => b.classList.toggle("tm-active", Number(b.dataset.sec) === sec));
      updateDisplay();
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.28, 0.56].forEach((delay) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.22);
          osc.connect(gain).connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.25);
        });
      } catch (e) {}
    }

    function tick() {
      remainSec -= 1;
      if (remainSec <= 0) {
        remainSec = 0;
        updateDisplay();
        stop();
        statusEl.textContent = "⏰ 시간이 끝났어요!";
        statusEl.classList.add("tm-done");
        beep();
        return;
      }
      updateDisplay();
    }

    function start() {
      if (running) return;
      if (remainSec <= 0) remainSec = totalSec;
      running = true;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      statusEl.classList.remove("tm-done");
      statusEl.textContent = "진행 중이에요…";
      timerId = setInterval(tick, 1000);
    }

    function stop() {
      running = false;
      clearInterval(timerId);
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", () => {
      stop();
      statusEl.textContent = "일시정지했어요.";
    });
    resetBtn.addEventListener("click", () => {
      stop();
      remainSec = totalSec;
      statusEl.classList.remove("tm-done");
      statusEl.textContent = "초기화했어요.";
      updateDisplay();
    });

    presetBtns.forEach((btn) => {
      btn.addEventListener("click", () => setTotal(Number(btn.dataset.sec), btn.textContent));
    });

    setTotal(60, "1분");
  })();
</script>
</body>
</html>
