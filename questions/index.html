<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>면접 예상질문 카드 · 수시 면접전형 준비</title>
<link rel="stylesheet" href="../assets/style.css">
<script>document.documentElement.classList.add('gate-lock')</script>
<style>html.gate-lock body{visibility:hidden}</style>
<style>
  .qc-wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px 80px; text-align: center; }
  .qc-cat {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }
  .qc-stage {
    position: relative;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .qc-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    padding: 48px 32px;
    font-size: clamp(20px, 3.4vw, 27px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.5;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .qc-card.qc-anim { opacity: 0; transform: scale(0.97); }
  .qc-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .qc-arrow {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .qc-arrow:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .qc-arrow:active { transform: scale(0.94); }
  .qc-arrow:disabled { opacity: 0.35; cursor: default; }
  .qc-arrow:disabled:hover { background: var(--surface); }
  .qc-counter { font-size: 14px; color: var(--text-secondary); font-weight: 600; min-width: 70px; }
  .qc-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  .qc-hint { color: var(--text-secondary); font-size: 13.5px; margin-top: 18px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <span class="brand">면접 예상질문 카드</span>
    <a class="back" href="../index.html">← 전체 목록</a>
  </div>
</nav>

<header class="hero" style="padding:48px 0 8px;">
  <div class="wrap">
    <div class="eyebrow">수시 면접전형 준비</div>
    <h1 style="font-size:clamp(24px,4vw,36px);">면접 예상질문 카드</h1>
    <p>질문만 카드로 하나씩 보여드려요. 화살표를 눌러 다음/이전 질문으로 넘어가며 실전처럼 답변을 연습해보세요.</p>
  </div>
</header>

<main class="qc-wrap">
  <div class="qc-cat" id="qc-cat">공통·인성</div>

  <div class="qc-stage">
    <div class="qc-card" id="qc-card"></div>
  </div>

  <div class="qc-nav">
    <button class="qc-arrow" id="qc-prev" aria-label="이전 질문">←</button>
    <span class="qc-counter" id="qc-counter">1 / 24</span>
    <button class="qc-arrow" id="qc-next" aria-label="다음 질문">→</button>
  </div>

  <div class="qc-tools">
    <button class="btn btn-ghost btn-sm" id="qc-shuffle">🔀 순서 섞기</button>
    <button class="btn btn-ghost btn-sm" id="qc-restart">↺ 처음부터</button>
  </div>

  <p class="qc-hint">키보드 ← → 방향키로도 넘길 수 있어요. 실제 면접 문항은 대학마다 다르니, 이 카드는 연습용 참고 질문입니다.</p>
</main>

<footer>
  <div class="wrap">관리자: 차윤정 (3학년 3반 담임)</div>
</footer>

<script src="../assets/config.js"></script>
<script src="../assets/gate.js"></script>
<script>
  const QUESTIONS = [
    { cat: "공통·인성", q: "자기소개를 1분 이내로 해보세요." },
    { cat: "공통·인성", q: "우리 대학(학과)에 지원한 동기는 무엇인가요?" },
    { cat: "공통·인성", q: "고등학교 재학 중 가장 기억에 남는 활동은 무엇인가요?" },
    { cat: "공통·인성", q: "특성화고를 선택한 이유는 무엇인가요?" },
    { cat: "공통·인성", q: "특성화고 재학 중 배운 점 중 대학생활에 도움이 될 것 같은 점은 무엇인가요?" },
    { cat: "공통·인성", q: "자신의 장점과 단점을 각각 말해보세요." },
    { cat: "공통·인성", q: "학교생활 중 어려움을 극복했던 경험이 있나요?" },
    { cat: "공통·인성", q: "팀 프로젝트나 조별활동에서 갈등을 해결한 경험이 있나요?" },
    { cat: "공통·인성", q: "입학 후 구체적인 학업계획을 말해보세요." },
    { cat: "공통·인성", q: "졸업 후 진로 계획은 무엇인가요?" },
    { cat: "전공·실기", q: "본인이 생각하는 좋은 디자인이란 무엇인가요?" },
    { cat: "전공·실기", q: "최근 관심 있게 본 디자인·미술 작품이나 작가가 있나요?" },
    { cat: "전공·실기", q: "포트폴리오(작품) 중 가장 자신 있는 작품을 소개해보세요." },
    { cat: "전공·실기", q: "그 작품을 제작하면서 어려웠던 점과 해결 방법은 무엇이었나요?" },
    { cat: "전공·실기", q: "평소 어떤 디자인 트렌드나 이슈에 관심이 있나요?" },
    { cat: "전공·실기", q: "본인의 디자인 스타일을 한 단어로 표현한다면?" },
    { cat: "전공·실기", q: "디자인을 할 때 가장 중요하게 생각하는 요소는 무엇인가요?" },
    { cat: "전공·실기", q: "협업으로 진행한 디자인 프로젝트 경험이 있다면 소개해주세요." },
    { cat: "전공·실기", q: "실패했던 작품이나 프로젝트 경험이 있다면 이야기해보세요." },
    { cat: "전공·실기", q: "창의성을 기르기 위해 평소 어떤 노력을 하나요?" },
    { cat: "시사·상황", q: "최근 사회적으로 이슈가 되는 디자인 관련 사건이나 트렌드가 있다면 말해보세요." },
    { cat: "시사·상황", q: "AI가 디자인 분야에 미치는 영향에 대해 어떻게 생각하나요?" },
    { cat: "시사·상황", q: "입학 후 원하는 프로젝트를 진행할 수 있다면 어떤 것을 하고 싶나요?" },
    { cat: "마무리", q: "마지막으로 하고 싶은 말이 있다면 자유롭게 말해보세요." },
  ];

  let order = QUESTIONS.map((_, i) => i);
  let pos = 0;

  const cardEl = document.getElementById("qc-card");
  const catEl = document.getElementById("qc-cat");
  const counterEl = document.getElementById("qc-counter");
  const prevBtn = document.getElementById("qc-prev");
  const nextBtn = document.getElementById("qc-next");

  function render(animate) {
    const item = QUESTIONS[order[pos]];
    const show = () => {
      catEl.textContent = item.cat;
      cardEl.textContent = item.q;
      counterEl.textContent = `${pos + 1} / ${order.length}`;
      prevBtn.disabled = pos === 0;
      nextBtn.disabled = pos === order.length - 1;
      cardEl.classList.remove("qc-anim");
    };
    if (animate) {
      cardEl.classList.add("qc-anim");
      setTimeout(show, 140);
    } else {
      show();
    }
  }

  function go(delta) {
    const next = pos + delta;
    if (next < 0 || next >= order.length) return;
    pos = next;
    render(true);
  }

  prevBtn.addEventListener("click", () => go(-1));
  nextBtn.addEventListener("click", () => go(1));

  document.getElementById("qc-shuffle").addEventListener("click", () => {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    render(true);
  });

  document.getElementById("qc-restart").addEventListener("click", () => {
    order = QUESTIONS.map((_, i) => i);
    pos = 0;
    render(true);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  render(false);
</script>
</body>
</html>
